[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-ops-demo"
version = "0.1.0"
description = "Local food delivery operations Agent MVP demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "playwright>=1.49,<2.0",
]
browser_use = [
  "browser-use>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["food_ops_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "browser_use: tests that require the browser-use package (install with extra [browser_use])",
]
